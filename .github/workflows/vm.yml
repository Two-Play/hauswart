name: VM tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      suites: ${{ steps.list.outputs.suites }}
      week: ${{ steps.list.outputs.week }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: list
        run: |
          suites=$(python3 test/regression.py --list | python3 -c 'import json,sys; print(json.dumps([s for s in json.load(sys.stdin) if s.startswith("vm-")]))')
          echo "suites=$suites" >>"$GITHUB_OUTPUT"
          echo "week=$(date +%G-%V)" >>"$GITHUB_OUTPUT"
      - run: cd gui && go mod download
      - run: make packages
      - run: tar -czf build.tar.gz dist web/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-build
          path: build.tar.gz
          retention-days: 3
      # Weekly, because the CoreOS image that the tests update from moves on.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hauswart-vm
          key: vm-images-${{ steps.list.outputs.week }}
      - run: python3 test/vm.py images

  vm:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.prepare.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: qemu-system-x86 qemu-utils xorriso swtpm ovmf
      # Fails here, visibly, if a runner has no KVM.
      - name: Open KVM to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 2
          test -w /dev/kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-build
      - run: tar -xzf build.tar.gz
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hauswart-vm
          key: vm-images-${{ needs.prepare.outputs.week }}
      - run: python3 test/regression.py --no-prep "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          REGRESSION_LOGS: ${{ runner.temp }}/logs
      - if: failure()
        run: tail -n 80 "$RUNNER_TEMP"/logs/*.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-logs-${{ matrix.suite }}
          path: ${{ runner.temp }}/logs/*.log
          retention-days: 7

  vm-ok:
    if: always()
    needs: [prepare, vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PREPARE: ${{ needs.prepare.result }}
          VM: ${{ needs.vm.result }}
        run: test "$PREPARE" = success && test "$VM" = success
